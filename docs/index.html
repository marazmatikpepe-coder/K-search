<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>K-search</title>
<link rel="stylesheet" href="glass.css">
<style>
body{display:flex;flex-direction:column;align-items:center;overflow:auto;-webkit-user-select:text;user-select:text}
main{width:min(720px,92vw);text-align:center;margin:12vh 0 40px;animation:in .45s ease-out}
.lg{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:24px}
.lg img{width:64px;height:64px}.lg h1{font-size:clamp(38px,8vw,60px);letter-spacing:-1.5px;font-weight:650}
form{display:flex;gap:8px;padding:8px;border-radius:calc(var(--r) + 14px)}
input{flex:1;height:46px;border:0;border-radius:calc(var(--r) + 6px);background:rgba(var(--shade),.25);color:var(--fg);font:inherit;font-size:16px;padding:0 20px;outline:0}
input::placeholder{color:var(--fg2)}input:focus{box-shadow:0 0 0 2px var(--c1)}
.go{width:46px;height:46px;border:0;border-radius:50%;background:var(--c1);color:#fff;cursor:pointer;font-size:18px;transition:transform .15s}.go:active{transform:scale(.9)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.chips button{border:1px solid rgba(255,255,255,.16);background:rgba(var(--tint),.08);padding:7px 15px;border-radius:18px;cursor:pointer;transition:background .2s}
.chips button:hover{background:rgba(var(--tint),.2)}.chips button.on{background:var(--c1);border-color:var(--c1);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;margin-top:34px}
.t{position:relative;padding:14px 8px 10px;border-radius:calc(var(--r) + 4px);cursor:pointer;transition:transform .18s}
.t:hover{transform:translateY(-3px)}.t img{width:34px;height:34px;border-radius:9px}
.t b{display:block;margin-top:8px;font-weight:500;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.t i{position:absolute;top:4px;right:6px;font-style:normal;opacity:0;cursor:pointer}.t:hover i{opacity:.7}
.hint{margin-top:26px;color:var(--fg2);font-size:12px}
@keyframes in{from{opacity:0;transform:translateY(10px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<main>
 <div class="lg"><img src="logo.png" alt=""><h1>K-search</h1></div>
 <form id="f" class="glass"><input id="q" placeholder="Найти что угодно в интернете" autofocus autocomplete="off"><button class="go">➜</button></form>
 <div class="chips" id="types"></div><div class="chips" id="engs"></div>
 <div class="tiles" id="tiles"></div>
 <p class="hint" id="hint"></p>
</main>
<script src="theme.js"></script>
<script>
const E={google:{n:'Google',web:'https://www.google.com/search?q=',img:'https://www.google.com/search?tbm=isch&q=',vid:'https://www.google.com/search?tbm=vid&q=',news:'https://www.google.com/search?tbm=nws&q=',map:'https://www.google.com/maps/search/'},
bing:{n:'Bing',web:'https://www.bing.com/search?q=',img:'https://www.bing.com/images/search?q=',vid:'https://www.bing.com/videos/search?q=',news:'https://www.bing.com/news/search?q=',map:'https://www.bing.com/maps?q='},
ddg:{n:'DuckDuckGo',web:'https://duckduckgo.com/?q=',img:'https://duckduckgo.com/?iax=images&ia=images&q=',vid:'https://duckduckgo.com/?iax=videos&ia=videos&q=',news:'https://duckduckgo.com/?iar=news&ia=news&q=',map:'https://duckduckgo.com/?iaxm=maps&ia=maps&q='},
yandex:{n:'Яндекс',web:'https://yandex.com/search/?text=',img:'https://yandex.com/images/search?text=',vid:'https://yandex.com/video/search?text=',news:'https://newssearch.yandex.com/yandsearch?text=',map:'https://yandex.com/maps/?text='},
brave:{n:'Brave',web:'https://search.brave.com/search?q=',img:'https://search.brave.com/images?q=',vid:'https://search.brave.com/videos?q=',news:'https://search.brave.com/news?q=',map:'https://search.brave.com/search?q='}};
const T={web:'Поиск',img:'Картинки',vid:'Видео',news:'Новости',map:'Карты'};
const $=s=>document.querySelector(s);
let S=null,eng=localStorage.eng||'google',type=localStorage.type||'web';
function chips(box,o,cur,set,lab){box.textContent='';for(const k in o){const b=document.createElement('button');b.type='button';b.textContent=lab(k);if(k===cur)b.className='on';b.onclick=()=>{set(k);draw()};box.append(b)}}
function draw(){
 chips($('#types'),T,type,k=>{type=k;localStorage.type=k},k=>T[k]);
 chips($('#engs'),E,eng,k=>{eng=k;localStorage.eng=k},k=>E[k].n);
 const box=$('#tiles');box.textContent='';
 const pins=S&&S.pins?(S.pins[S.profile]||[]):[];
 pins.forEach(p=>{const d=document.createElement('div');d.className='t glass';
  const i=document.createElement('img');i.src=p.icon||'logo.png';i.onerror=()=>{i.src='logo.png'};
  const b=document.createElement('b');b.textContent=p.title;const x=document.createElement('i');x.textContent='✕';x.title='Открепить';
  x.onclick=e=>{e.stopPropagation();ks.send('pins:del',p.url)};d.onclick=()=>location.href=p.url;d.append(x,i,b);box.append(d)});
 $('#hint').textContent=pins.length?'':(window.ks?'Закрепите сайт кнопкой ★ в панели — он появится здесь.':'');
}
$('#f').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();if(!q)return;
 if(/^[a-z]+:\/\//i.test(q))return location.href=q;
 if(!/\s/.test(q)&&/^(localhost|[\w-]+(\.[\w-]+)+)(:\d+)?([/?#].*)?$/i.test(q))return location.href='https://'+q;
 location.href=E[eng][type]+encodeURIComponent(q)};
applyTheme(null);draw();
if(window.ks){ks.invoke('settings:get').then(s=>{S=s;if(!localStorage.eng)eng=s.engine;applyTheme(s);draw()});ks.on('settings',s=>{S=s;applyTheme(s);draw()})}
</script></body></html>
