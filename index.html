<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>K-search</title>
<link rel="stylesheet" href="glass.css">
<style>
#top{position:fixed;inset:0 0 auto 0;height:40px;display:flex;align-items:center;gap:8px;padding:0 150px 0 12px;-webkit-app-region:drag}
body.mac #top{padding-left:80px}
#logo{width:22px;height:22px}
#tabs{flex:1;display:flex;gap:4px;min-width:0;overflow:hidden;align-items:center}
.tab{-webkit-app-region:no-drag;display:flex;align-items:center;gap:7px;height:30px;min-width:44px;max-width:210px;flex:1 1 190px;padding:0 6px 0 9px;border-radius:calc(var(--r) - 5px);
 color:var(--fg2);cursor:default;transition:background .18s,color .18s;animation:pop .22s ease-out}
.tab:hover{background:rgba(var(--tint),.1)}
.tab.on{color:var(--fg);background:rgba(var(--tint),.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.tab img{width:15px;height:15px;border-radius:4px;flex:none}
.tab span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab.zz span{opacity:.55;font-style:italic}.tab.ld img{animation:spin 1s linear infinite}
.x{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;opacity:0;flex:none}
.tab:hover .x,.tab.on .x{opacity:.7}.x:hover{background:rgba(var(--tint),.25);opacity:1!important}
#plus{-webkit-app-region:no-drag;flex:none}
body.tl #tabs{position:fixed;left:0;top:var(--t);bottom:var(--b);width:220px;flex-direction:column;align-items:stretch;padding:8px;overflow-y:auto;overflow-x:hidden;gap:3px;-webkit-app-region:no-drag;background:rgba(var(--shade),.18)}
body.tl .tab{flex:none;max-width:none}
body.tl #plus{align-self:flex-start}
#bar{position:fixed;left:8px;right:8px;top:44px;height:48px;display:flex;align-items:center;gap:4px;padding:0 8px;border-radius:calc(var(--r) + 6px)}
body.bb #bar{top:auto;bottom:4px}
.b{-webkit-app-region:no-drag;position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:none;border:0;cursor:pointer;transition:background .15s,transform .15s}
.b:hover{background:rgba(var(--tint),.2)}.b:active{transform:scale(.9)}.b:disabled{opacity:.3;pointer-events:none}
.b.on svg{fill:var(--c1);stroke:var(--c1)}
.prof{font-weight:700;font-size:13px;background:var(--c1);color:#fff}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#addr{-webkit-app-region:no-drag;flex:1;min-width:80px;height:34px;border:1px solid rgba(255,255,255,.12);border-radius:calc(var(--r) + 2px);background:rgba(var(--shade),.25);color:var(--fg);padding:0 14px;font:inherit;outline:0;user-select:text}
#addr:focus{box-shadow:0 0 0 2px var(--c1)}
#info{position:fixed;left:8px;right:8px;top:96px;height:32px;display:none;align-items:center;gap:10px;padding:0 6px 0 14px;border-radius:var(--r);animation:pop .2s ease-out}
body.bb #info{top:44px}
#info.show{display:flex}#info p{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ib{border:0;background:rgba(var(--tint),.2);padding:4px 12px;border-radius:12px;cursor:pointer}.ib:hover{background:var(--c1);color:#fff}
body.edit [data-id]{outline:1px dashed rgba(255,255,255,.45);outline-offset:2px;cursor:grab;border-radius:10px}
body.edit [data-id].ghost{opacity:.35}
#ec{display:none;align-items:center;gap:6px;margin-left:6px;-webkit-app-region:no-drag}
body.edit #ec{display:flex}
#ec select,#ec button{background:rgba(var(--shade),.3);color:var(--fg);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:4px 8px;font:inherit}
#ec button{background:var(--c1);color:#fff;border:0;cursor:pointer}
#lock{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;padding-top:11vh;background:var(--wall) center/cover;cursor:pointer}
#lock.show{display:flex;animation:fade .35s}#lock.out{animation:out .4s ease-in forwards}
#lock img{width:84px;height:84px;margin-bottom:14px}
#clock{font-size:min(20vw,118px);font-weight:600;letter-spacing:-2px;line-height:1}
#date{font-size:19px;margin-top:6px;color:var(--fg2)}
#ltext{margin-top:24px;padding:11px 22px;border-radius:calc(var(--r) + 8px)}
#hint{position:absolute;bottom:5vh;color:var(--fg2);animation:pulse 2.4s infinite}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.97)}}@keyframes fade{from{opacity:0}}
@keyframes out{to{opacity:0;transform:translateY(-100%)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div id="top"><img id="logo" src="logo.png" alt=""><div id="tabs"></div></div>
<div id="bar" class="glass"></div>
<div id="info" class="glass"></div>
<div id="lock"><img src="logo.png" alt=""><div id="clock"></div><div id="date"></div><div id="ltext" class="glass"></div><div id="hint">Нажмите, чтобы открыть</div></div>
<script src="theme.js"></script><script src="ui.js"></script>
</body></html>
